# Self-hosted Lumo on a single VPS: the app (API + SPA, one process) behind
# Caddy, which terminates TLS and gets/renews a Let's Encrypt certificate
# automatically for LUMO_DOMAIN. Bring your own domain + an A record → this box.
#
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
#
# Prefer nginx + certbot instead of Caddy? Skip the caddy service and use the
# nginx.conf in this directory. See docs/ops/vps-deployment.md.

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      args:
        # Same-origin SPA → API, so /v1 is correct. Inlined at build time.
        VITE_API_BASE: /v1
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
      # Container-internal path of the SQLite DB. The app writes it here; the
      # bind mount below persists it on the host's mounted cloud disk. (If you
      # set TURSO_* in .env instead, that takes precedence and this is unused.)
      LUMO_DB_PATH: /data/lumo.db
    volumes:
      # Persist SQLite on the mounted cloud disk. LUMO_DATA_DIR is the host mount
      # (see .env). The dir must be writable by uid 1000 (bootstrap.sh chowns it).
      - ${LUMO_DATA_DIR:-/mnt/lumo-data}:/data
      # Persist the log file (LUMO_LOG_FILE) across restarts, if you set one to a
      # path under /var/log/lumo.
      - lumo-logs:/var/log/lumo
    expose:
      - "8080"
    # No published ports: only Caddy talks to the app, over the internal network.
    # P0 hardening (see docs/business/commercial-plan-post-launch.md §3.1):
    # bound the json-file driver's size. Same as docker-compose.prod.yml so
    # the local-build and prebuilt-image paths stay aligned. Without this,
    # sustained traffic fills the host disk, taking SQLite (and every write)
    # down. 10m x 3 = 30m rotated per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # P1 hardening (see §4.1): cap app memory so a leak/OOM can't trigger
    # the host OOM killer (which can take Caddy/Docker with it).
    mem_limit: 512m

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      LUMO_DOMAIN: ${LUMO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Same log cap as app (see P0 §3.1 above).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  lumo-logs:
  caddy-data:
  caddy-config:
