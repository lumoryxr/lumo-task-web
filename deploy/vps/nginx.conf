# nginx reverse proxy for Lumo — alternative to the Caddy service in
# docker-compose.yml (use this if you already run nginx + certbot on the host).
#
# TLS setup (host nginx + certbot):
#   sudo apt install nginx certbot python3-certbot-nginx
#   # put this file at /etc/nginx/sites-available/lumo, edit server_name + the
#   # proxy_pass port to wherever the app listens (8080 in compose, or the
#   # LUMO_PORT/PORT you run the systemd service on), then:
#   sudo ln -s /etc/nginx/sites-available/lumo /etc/nginx/sites-enabled/lumo
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.example.com   # provisions + auto-renews TLS
#
# certbot rewrites this server block to add the listen 443 + ssl_certificate
# lines and an HTTP→HTTPS redirect, so start with plain :80 here.

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;   # ← your domain

    # The app serves both the SPA and /v1 on one port, so a single proxy_pass
    # covers everything. No try_files / static root needed.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Keep the health check cheap and un-logged.
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }

    client_max_body_size 12m;   # matches the backend body-size limit headroom
}
