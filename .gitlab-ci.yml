# ============================================================================
# Lumo Task — GitLab CI/CD
# 迁移自原 GitHub Actions：ci.yml（门禁聚合）+ release.yml（Tag 发布）
#                          + release-windows.yml（Windows 打包）
#
# 门禁等价说明：GitHub 用 branch protection 盯着名为 "CI" 的聚合 job；
# GitLab 改用「合并请求 → Pipelines must succeed」让整条流水线作为门禁。
# 这里仍保留一个 `ci` 聚合 job 用于状态可视化与对齐。
# ============================================================================

stages:
  - test
  - build
  - gate
  - release
  - package

# 避免「分支 push」与「MR」同时各触发一条流水线（GitHub 上是 push+pull_request 两个事件）
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  interruptible: true        # 新提交自动取消同分支旧流水线（等价 concurrency: cancel-in-progress）

# ── 复用模板：前端(Node 20) / 后端(Node 22) ───────────────────────────────────
# before_script 统一先构建共享契约 @lumo/contracts（file: 依赖，所有消费方先要它）
.fe:
  image: node:20
  cache:
    key:
      files: [web-app/package-lock.json]
    paths: [.npm/]
  before_script:
    - (cd packages/contracts && npm ci && npm run build)

.be:
  image: node:22
  cache:
    key:
      files: [backend/package-lock.json]
    paths: [.npm/]
  before_script:
    - (cd packages/contracts && npm ci && npm run build)

# ── 1. 前端 类型检查 ──────────────────────────────────────────────────────────
typecheck:
  extends: .fe
  stage: test
  script:
    - cd web-app && npm ci && npm run typecheck

# ── 2. 前端 Lint ─────────────────────────────────────────────────────────────
lint:
  extends: .fe
  stage: test
  script:
    - cd web-app && npm ci && npm run lint

# ── 3. 前端 单元测试 (Vitest) ────────────────────────────────────────────────
frontend-test:
  extends: .fe
  stage: test
  script:
    - cd web-app && npm ci && npm test

# ── 4. 前端 Build (Vite) ─────────────────────────────────────────────────────
build:
  extends: .fe
  stage: build
  needs: [typecheck]
  script:
    - cd web-app && npm ci && npm run build
  artifacts:
    name: "dist-$CI_COMMIT_SHORT_SHA"
    paths: [web-app/dist]
    expire_in: 7 days

# ── 5. 前端 Playwright UI 测试 ───────────────────────────────────────────────
ui-test:
  extends: .fe
  stage: test
  needs: [typecheck]
  script:
    - cd web-app && npm ci
    - npx playwright install chromium --with-deps
    - BROWSER=none npx playwright test
  artifacts:
    when: always
    paths:
      - web-app/playwright-report/
      - web-app/test-results/
    expire_in: 7 days

# ── 6. 后端 类型检查 ──────────────────────────────────────────────────────────
backend-typecheck:
  extends: .be
  stage: test
  script:
    - cd backend && npm ci && npm run typecheck

# ── 7. 后端 Build ────────────────────────────────────────────────────────────
backend-build:
  extends: .be
  stage: build
  needs: [backend-typecheck]
  script:
    - cd backend && npm ci && npm run build

# ── 8. 后端 API 测试（覆盖率门禁 ≥80% 行，由 test:coverage 自身强制）─────────────
backend-test:
  extends: .be
  stage: test
  needs: [backend-typecheck]
  script:
    - cd backend && npm ci && npm run test:coverage

# ── 9. 后端 安全测试（鉴权/输入/密钥/限流）─────────────────────────────────────
backend-security:
  extends: .be
  stage: test
  needs: [backend-typecheck]
  script:
    - cd backend && npm ci && npm run test:security

# ── 10. 后端 规范守卫（error-shape / contract-first）──────────────────────────
backend-standards:
  extends: .be
  stage: test
  needs: [backend-typecheck]
  script:
    - cd backend && npm ci && npm run test:standards

# ── 11. 后端 集成测试（真实 HTTP + 真实 SQLite）───────────────────────────────
backend-integration:
  extends: .be
  stage: test
  needs: [backend-typecheck]
  script:
    - cd backend && npm ci && npm run test:integration

# ── 12. 契约 schema 单测（唯一真相源）────────────────────────────────────────
contracts-test:
  image: node:22
  stage: test
  cache:
    key:
      files: [packages/contracts/package-lock.json]
    paths: [.npm/]
  script:
    - cd packages/contracts && npm ci && npm test

# ── 13. 依赖安全审计（npm audit，仅生产依赖）──────────────────────────────────
security:
  image: node:20
  stage: test
  script:
    - cd web-app && npm ci && npm audit --audit-level=high --omit=dev
    - cd ../backend && npm ci && npm audit --audit-level=high

# ── 聚合门禁：所有检查通过才算绿（对齐 GitHub 的 "CI" job）─────────────────────
ci:
  stage: gate
  image: alpine:3
  needs:
    - typecheck
    - lint
    - frontend-test
    - build
    - ui-test
    - backend-typecheck
    - backend-build
    - backend-test
    - backend-security
    - backend-standards
    - backend-integration
    - contracts-test
    - security
  script:
    - echo "All CI checks passed."

# ============================================================================
# 发布：推送 v* tag 时自动建 GitLab Release（等价 release.yml）
# ============================================================================
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: |
      Lumo Task $CI_COMMIT_TAG

      详细变更见 [CHANGELOG.md]($CI_PROJECT_URL/-/blob/main/CHANGELOG.md)。

# ============================================================================
# Windows 打包（等价 release-windows.yml）
#
# ⚠️ 必须在 Windows 运行器上构建：后端 libsql/@neon-rs 是平台相关原生模块，
#    Linux 上 npm ci 会装错平台的 .node，打进 Windows 包会运行时崩溃。
#
# 触发：在 main（或某个 tag）上手动运行。运行前在「Run pipeline」里
#       加一个变量 VERSION_LABEL=1.2.3（写进 package.json → 安装包文件名）。
#
# 运行器：tags 指定 GitLab SaaS Windows 运行器；若你的套餐没有，
#        改成自建 Windows runner 的 tag（见文件末尾说明）。
# ============================================================================
package:windows:
  stage: package
  interruptible: false
  tags: [saas-windows-medium-amd64]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
  variables:
    VERSION_LABEL: ""        # 运行流水线时手动填，如 1.2.3
  script:
    - node -v
    # 1) 共享契约
    - cd packages/contracts; npm ci; npm run build; cd $CI_PROJECT_DIR
    # 2) 后端 bundle（含 Windows 原生 libsql）
    - cd backend; npm ci --include=dev; npm run build; cd $CI_PROJECT_DIR
    # 3) 前端
    - cd web-app; npm ci; npm run build; cd $CI_PROJECT_DIR
    # 4) 把版本号写进 package.json（安装包名 LumoTask-Setup-<version>.exe）
    - |
        $ver = "$env:VERSION_LABEL".TrimStart("v")
        if (-not $ver) { Write-Error "请在 Run pipeline 时设置 VERSION_LABEL，例如 1.2.3"; exit 1 }
        $json = Get-Content "web-app/package.json" -Raw | ConvertFrom-Json
        $json.version = $ver
        $json | ConvertTo-Json -Depth 100 | Set-Content "web-app/package.json"
        Write-Host "package version set to $ver"
    # 5) Electron 打包 NSIS x64
    - cd web-app; npx electron-builder --win --x64 --publish never; cd $CI_PROJECT_DIR
  artifacts:
    name: "LumoTask-Setup-$CI_COMMIT_SHORT_SHA"
    paths:
      - web-app/dist-electron/*.exe
    expire_in: 30 days
