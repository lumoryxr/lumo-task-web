<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3dffa0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumo Task" />
    <meta
      name="description"
      content="Lumo Task is a local-first task app. Know what to do in 10 seconds — then begin with one tap."
    />
    <link rel="canonical" href="https://task.lumoryxr.com/" />

    <!-- Open Graph / social preview (Slack, Discord, Telegram, WhatsApp, iMessage, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumo Task" />
    <meta property="og:title" content="Lumo Task — know what to do in 10 seconds" />
    <meta
      property="og:description"
      content="A local-first task app. Know what to do in 10 seconds — then begin with one tap."
    />
    <meta property="og:url" content="https://task.lumoryxr.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />

    <!-- Twitter / X (upgrade to summary_large_image once an og:image asset ships) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Lumo Task — know what to do in 10 seconds" />
    <meta
      name="twitter:description"
      content="A local-first task app. Know what to do in 10 seconds — then begin with one tap."
    />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lumo Task</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
