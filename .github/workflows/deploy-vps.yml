name: Deploy to VPS

# Tag-to-deploy for the self-hosted single-VPS setup (docs/ops/vps-deployment.md).
#
# Flow: build the single-process image (deploy/vps/Dockerfile) → push it to GHCR
# → SSH into the VPS and `docker compose ... pull && up -d` the prebuilt image.
# The small VPS never runs npm/Vite; it only pulls a ~image.
#
# Deploy is GATED so production is never touched by an ordinary commit:
#   • push to main        → build + push the image to GHCR only (a build check
#                           that proves the app still builds and is deployable).
#                           The running VPS is NOT touched.
#   • push a version tag  → build that commit AND deploy it to the VPS. This is
#     (e.g. v1.2.3)         how you ship a packaged release.
#   • manual dispatch     → build + deploy the chosen ref, on demand.
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Repo → Settings → Secrets and variables → Actions → add:
#   VPS_HOST       host or host:port of the box (e.g. 203.0.113.10 or
#                  203.0.113.10:2222). Port is optional and defaults to 22.
#   VPS_USER       ssh user (e.g. deploy)
#   VPS_PASSWORD   that ssh user's password (password auth; no key needed)
# Runtime secrets (LUMO_JWT_SECRET, …) live ONLY in the VPS's deploy/vps/.env —
# never in CI. The VPS must have the repo checked out at /opt/lumo and be logged
# in to ghcr.io (bootstrap.sh does both). See docs/ops/vps-deployment.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to build and deploy"
        required: false
        default: main
  push:
    # main → build-only (validation); a v* tag → build + deploy. The deploy job's
    # `if:` below is what enforces that split. No `paths:` filter here: it would
    # also gate tag pushes (AND semantics) and could silently skip a release.
    branches: [main]
    tags: ["v*"]

# Never let two deploys race the same box; a newer deploy supersedes an older one.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Resolve image tags
        id: meta
        run: |
          # GHCR requires a lowercase repo path; github.repository is already
          # lowercase for this org, but normalize to be safe.
          IMAGE_LC="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          echo "image_lc=${IMAGE_LC}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_LC}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vps/Dockerfile
          build-args: |
            VITE_API_BASE=/v1
          push: true
          tags: |
            ${{ steps.meta.outputs.image_lc }}:latest
            ${{ steps.meta.outputs.image_lc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS over SSH
    needs: build-and-push
    # The gate: deploy ONLY on a version tag or a manual run. A plain push to
    # main runs build-and-push (the build check) but skips this job entirely.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # VPS_HOST may be "host" or "host:port" — split it so we can store one
      # combined secret instead of two. Port defaults to 22 when absent.
      - name: Parse host:port
        id: ssh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          raw="${VPS_HOST}"
          if printf '%s' "$raw" | grep -q ':'; then
            host="${raw%:*}"; port="${raw##*:}"
          else
            host="$raw"; port="22"
          fi
          # Guard against a non-numeric/empty port (e.g. a bare IPv6 with no port).
          case "$port" in ''|*[!0-9]*) host="$raw"; port="22";; esac
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "port=${port}" >> "$GITHUB_OUTPUT"

      - name: Pull + restart on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ steps.ssh.outputs.port }}
          # Provisioning is delegated to bootstrap.sh — the SINGLE source of init
          # logic (Docker, the /opt/lumo checkout, the data dir, the .env seed).
          # If the box was never initialized the deploy just runs bootstrap first,
          # so there is only one place that knows how to set a box up — this
          # workflow never re-implements it.
          # Pins the exact image we built (by SHA); refreshes compose/Caddy from
          # main (never touches the gitignored .env); runs from deploy/vps so that
          # .env drives BOTH ${...} interpolation and the app's env_file.
          # Runs under the VPS user's login shell, which may be dash (/bin/sh) —
          # so keep this POSIX: `set -eu`, no bashism like `pipefail`.
          script: |
            set -eu
            # Never provisioned? Run the one init script. It installs Docker, clones
            # /opt/lumo, prepares the data dir, and seeds .env from the example.
            # (If it has to install Docker for a non-root user, the docker group
            # only applies to the NEXT login — just re-run the deploy once.)
            if [ ! -d /opt/lumo/.git ]; then
              echo "==> /opt/lumo not initialized — running bootstrap.sh"
              curl -fsSL https://raw.githubusercontent.com/lumoryxr/lumo-task-web/main/deploy/vps/bootstrap.sh | bash
            fi
            cd /opt/lumo
            git fetch --depth 1 origin main
            git reset --hard origin/main
            cd deploy/vps
            # The one thing bootstrap can't fill in: real secrets. It seeds .env
            # from .env.example with an EMPTY LUMO_JWT_SECRET — refuse to deploy
            # until a human fills it, rather than booting with blank crypto keys.
            if [ ! -f .env ] || ! grep -Eq '^LUMO_JWT_SECRET=.+' .env; then
              echo "::error::/opt/lumo/deploy/vps/.env is missing or LUMO_JWT_SECRET is empty. Fill it in (LUMO_JWT_SECRET, LUMO_ENCRYPTION_KEY, LUMO_DOMAIN, LUMO_DATA_DIR) — make secrets with 'openssl rand -hex 32' — then re-run. See docs/ops/vps-deployment.md."
              exit 1
            fi
            export LUMO_IMAGE='${{ needs.build-and-push.outputs.image_ref }}'
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            # Smoke the app's health endpoint from inside the container.
            for i in $(seq 1 15); do
              if docker compose -f docker-compose.prod.yml exec -T app \
                   node -e "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "health OK"; exit 0
              fi
              sleep 2
            done
            echo "::error::app did not report healthy after deploy"; exit 1
