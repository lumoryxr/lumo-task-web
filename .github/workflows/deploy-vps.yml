name: Deploy to VPS

# Manual-deploy for the self-hosted single-VPS setup (docs/ops/vps-deployment.md).
#
# Flow: build the single-process image (deploy/vps/Dockerfile) → push it to GHCR
# → SSH into the VPS and `docker compose ... pull && up -d` the prebuilt image.
# The small VPS never runs npm/Vite; it only pulls a ~image.
#
# Deploy is GATED so production is never touched by an ordinary commit:
#   • push to main     → build + push the image to GHCR only (a build check that
#                        proves the app still builds and is deployable). The
#                        running VPS is NOT touched.
#   • manual dispatch  → build + deploy the chosen ref, on demand. THIS is the
#                        only thing that touches production. The `ref` input must
#                        be an EXISTING branch/tag/SHA (default main), not a new
#                        version string you intend to create.
# (No tag trigger: version tags `v*` belong to the product Release workflow
# — release.yml — and must not double as a production deploy.)
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Repo → Settings → Secrets and variables → Actions.
# SSH access (Secrets):
#   VPS_HOST       host or host:port of the box (e.g. 203.0.113.10 or
#                  203.0.113.10:2222). Port is optional and defaults to 22.
#   VPS_USER       ssh user (e.g. deploy)
#   VPS_PASSWORD   that ssh user's password (password auth; no key needed)
# Runtime config is GitHub-managed: the deploy job RENDERS deploy/vps/.env on the
# box from these values every run (single source of truth — you no longer edit
# .env by hand on the VPS). Sensitive values go under Secrets, non-sensitive under
# Variables; the full list and which-goes-where is in docs/ops/vps-deployment.md.
#   Secrets (required):   LUMO_JWT_SECRET, LUMO_ENCRYPTION_KEY  (openssl rand -hex 32)
#   Variables (required): LUMO_DOMAIN, LUMO_APP_BASE_URL   (LUMO_DATA_DIR defaults
#                         to /mnt/lumo-data)
#   Optional: email/AI/OAuth/Turso keys — see the env: block below and the docs.
# The VPS must have the repo checked out at /opt/lumo and be logged in to ghcr.io
# (bootstrap.sh does both).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to build and deploy"
        required: false
        default: main
  push:
    # main only, and ONLY to build the image (validation) — the deploy job's
    # `if:` below skips deployment for push events. Scope to app-affecting paths
    # so unrelated commits don't rebuild.
    branches: [main]
    paths:
      - "backend/**"
      - "web-app/**"
      - "packages/contracts/**"
      - "deploy/vps/**"
      - ".github/workflows/deploy-vps.yml"

# Never let two deploys race the same box; a newer deploy supersedes an older one.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Resolve image tags
        id: meta
        run: |
          # GHCR requires a lowercase repo path; github.repository is already
          # lowercase for this org, but normalize to be safe.
          IMAGE_LC="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          echo "image_lc=${IMAGE_LC}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_LC}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/vps/Dockerfile
          build-args: |
            VITE_API_BASE=/v1
          push: true
          tags: |
            ${{ steps.meta.outputs.image_lc }}:latest
            ${{ steps.meta.outputs.image_lc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS over SSH
    needs: build-and-push
    # The gate: deploy ONLY on a manual run. A plain push to main runs
    # build-and-push (the build check) but skips this job entirely.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # GitHub-managed runtime config. These become the deploy/vps/.env rendered on
    # the box (see the SSH step). Sensitive → Secrets, non-sensitive → Variables.
    # An unset Secret/Variable resolves to "" here; the render step supplies
    # defaults where it matters and refuses to boot if the crypto keys are empty.
    env:
      # Sensitive (repo Secrets)
      LUMO_JWT_SECRET: ${{ secrets.LUMO_JWT_SECRET }}
      LUMO_ENCRYPTION_KEY: ${{ secrets.LUMO_ENCRYPTION_KEY }}
      LUMO_AI_KEY: ${{ secrets.LUMO_AI_KEY }}
      LUMO_RESEND_API_KEY: ${{ secrets.LUMO_RESEND_API_KEY }}
      LUMO_GITHUB_CLIENT_SECRET: ${{ secrets.LUMO_GITHUB_CLIENT_SECRET }}
      LUMO_METRICS_TOKEN: ${{ secrets.LUMO_METRICS_TOKEN }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Non-sensitive (repo Variables)
      LUMO_DOMAIN: ${{ vars.LUMO_DOMAIN }}
      LUMO_APP_BASE_URL: ${{ vars.LUMO_APP_BASE_URL }}
      LUMO_DATA_DIR: ${{ vars.LUMO_DATA_DIR }}
      # Optional: only needed if the data disk is a network fs that refuses chown
      # and enforces a fixed owner — set these to that uid/gid. Empty = uid 1000.
      LUMO_UID: ${{ vars.LUMO_UID }}
      LUMO_GID: ${{ vars.LUMO_GID }}
      LUMO_ALLOWED_ORIGINS: ${{ vars.LUMO_ALLOWED_ORIGINS }}
      LUMO_ADMIN_EMAILS: ${{ vars.LUMO_ADMIN_EMAILS }}
      LUMO_LOG_LEVEL: ${{ vars.LUMO_LOG_LEVEL }}
      LUMO_EMAIL_PROVIDER: ${{ vars.LUMO_EMAIL_PROVIDER }}
      LUMO_EMAIL_FROM: ${{ vars.LUMO_EMAIL_FROM }}
      LUMO_AI_CLOUD_GLOBAL_CAP: ${{ vars.LUMO_AI_CLOUD_GLOBAL_CAP }}
      LUMO_GITHUB_CLIENT_ID: ${{ vars.LUMO_GITHUB_CLIENT_ID }}
      LUMO_GITHUB_CALLBACK_URL: ${{ vars.LUMO_GITHUB_CALLBACK_URL }}
      TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
    steps:
      # VPS_HOST may be "host" or "host:port" — split it so we can store one
      # combined secret instead of two. Port defaults to 22 when absent.
      - name: Parse host:port
        id: ssh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          raw="${VPS_HOST}"
          if printf '%s' "$raw" | grep -q ':'; then
            host="${raw%:*}"; port="${raw##*:}"
          else
            host="$raw"; port="22"
          fi
          # Guard against a non-numeric/empty port (e.g. a bare IPv6 with no port).
          case "$port" in ''|*[!0-9]*) host="$raw"; port="22";; esac
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "port=${port}" >> "$GITHUB_OUTPUT"

      - name: Pull + restart on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ steps.ssh.outputs.port }}
          # Forward the GitHub-managed config (job env:) into the remote shell so
          # the render step can write .env from it. Values travel over the
          # encrypted SSH channel; secret values stay masked in the Actions log.
          envs: LUMO_JWT_SECRET,LUMO_ENCRYPTION_KEY,LUMO_AI_KEY,LUMO_RESEND_API_KEY,LUMO_GITHUB_CLIENT_SECRET,LUMO_METRICS_TOKEN,TURSO_AUTH_TOKEN,LUMO_DOMAIN,LUMO_APP_BASE_URL,LUMO_DATA_DIR,LUMO_UID,LUMO_GID,LUMO_ALLOWED_ORIGINS,LUMO_ADMIN_EMAILS,LUMO_LOG_LEVEL,LUMO_EMAIL_PROVIDER,LUMO_EMAIL_FROM,LUMO_AI_CLOUD_GLOBAL_CAP,LUMO_GITHUB_CLIENT_ID,LUMO_GITHUB_CALLBACK_URL,TURSO_DATABASE_URL
          # Provisioning is delegated to bootstrap.sh — the SINGLE source of init
          # logic (Docker, the /opt/lumo checkout, the data dir, the .env seed).
          # If the box was never initialized the deploy just runs bootstrap first,
          # so there is only one place that knows how to set a box up — this
          # workflow never re-implements it.
          # Pins the exact image we built (by SHA); refreshes compose/Caddy from
          # main and RENDERS .env from GitHub-managed config; runs from deploy/vps
          # so that .env drives BOTH ${...} interpolation and the app's env_file.
          # Runs under the VPS user's login shell, which may be dash (/bin/sh) —
          # so keep this POSIX: `set -eu`, no bashism like `pipefail`.
          script: |
            set -eu
            # Never provisioned? Run the one init script. It installs Docker, clones
            # /opt/lumo, prepares the data dir, and seeds .env from the example.
            # (If it has to install Docker for a non-root user, the docker group
            # only applies to the NEXT login — just re-run the deploy once.)
            if [ ! -d /opt/lumo/.git ]; then
              echo "==> /opt/lumo not initialized — running bootstrap.sh"
              curl -fsSL https://raw.githubusercontent.com/lumoryxr/lumo-task-web/main/deploy/vps/bootstrap.sh | bash
            fi
            cd /opt/lumo
            git fetch --depth 1 origin main
            git reset --hard origin/main
            cd deploy/vps
            # Render .env from the GitHub-managed config forwarded above. GitHub is
            # the single source of truth: this FILE is regenerated every deploy, so
            # manage values in repo Secrets/Variables, not by hand on the box. The
            # crypto keys must be present or we refuse to boot with blank crypto.
            if [ -z "${LUMO_JWT_SECRET:-}" ] || [ -z "${LUMO_ENCRYPTION_KEY:-}" ]; then
              echo "::error::LUMO_JWT_SECRET / LUMO_ENCRYPTION_KEY are not set in GitHub. Add them under Settings → Secrets and variables → Actions → Secrets (generate each with 'openssl rand -hex 32'), then re-run. See docs/ops/vps-deployment.md."
              exit 1
            fi
            umask 077
            cat > .env <<EOF
            # Generated by the Deploy to VPS workflow — DO NOT edit by hand.
            # Manage these in GitHub → Settings → Secrets and variables → Actions.
            NODE_ENV=production
            LUMO_DOMAIN=${LUMO_DOMAIN:-}
            LUMO_APP_BASE_URL=${LUMO_APP_BASE_URL:-}
            LUMO_JWT_SECRET=${LUMO_JWT_SECRET}
            LUMO_ENCRYPTION_KEY=${LUMO_ENCRYPTION_KEY}
            LUMO_DATA_DIR=${LUMO_DATA_DIR:-/mnt/lumo-data}
            LUMO_UID=${LUMO_UID:-}
            LUMO_GID=${LUMO_GID:-}
            LUMO_ALLOWED_ORIGINS=${LUMO_ALLOWED_ORIGINS:-}
            LUMO_ADMIN_EMAILS=${LUMO_ADMIN_EMAILS:-}
            LUMO_LOG_LEVEL=${LUMO_LOG_LEVEL:-info}
            LUMO_EMAIL_PROVIDER=${LUMO_EMAIL_PROVIDER:-}
            LUMO_EMAIL_FROM=${LUMO_EMAIL_FROM:-}
            LUMO_RESEND_API_KEY=${LUMO_RESEND_API_KEY:-}
            LUMO_AI_KEY=${LUMO_AI_KEY:-}
            LUMO_AI_CLOUD_GLOBAL_CAP=${LUMO_AI_CLOUD_GLOBAL_CAP:-}
            LUMO_GITHUB_CLIENT_ID=${LUMO_GITHUB_CLIENT_ID:-}
            LUMO_GITHUB_CLIENT_SECRET=${LUMO_GITHUB_CLIENT_SECRET:-}
            LUMO_GITHUB_CALLBACK_URL=${LUMO_GITHUB_CALLBACK_URL:-}
            LUMO_METRICS_TOKEN=${LUMO_METRICS_TOKEN:-}
            TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
            TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
            EOF
            export LUMO_IMAGE='${{ needs.build-and-push.outputs.image_ref }}'
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            # Smoke the app's health endpoint from inside the container.
            for i in $(seq 1 15); do
              if docker compose -f docker-compose.prod.yml exec -T app \
                   node -e "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "health OK"; exit 0
              fi
              sleep 2
            done
            echo "::error::app did not report healthy after deploy"; exit 1
