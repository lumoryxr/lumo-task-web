name: Deploy Landing Page (superseded)

# SUPERSEDED by deploy-website.yml — the Astro site in website/ is now the
# published homepage on gh-pages. This legacy single-file landing/ deploy is
# kept for rollback only and no longer runs on push (both publish to the same
# gh-pages branch, so only one may auto-deploy). Trigger manually if you ever
# need to republish the old landing.
#
# GitHub Pages setup (unchanged):
#   Settings → Pages → Deploy from branch → gh-pages / (root)
#   URL: https://lumoryxr.github.io/lumo-task-web/

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Push landing/ to gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing
          force_orphan: false
          commit_message: "deploy: update landing page [skip ci]"
