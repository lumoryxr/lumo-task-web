name: Deploy Landing Page

# Pushes landing/index.html to the gh-pages branch whenever it changes on main.
# Does NOT use the github-pages Actions environment (avoids branch protection rules).
#
# To enable GitHub Pages (one-time setup):
#   Repo Settings → Pages → Source: "Deploy from a branch"
#   Branch: gh-pages  /  Folder: / (root)  → Save
#   URL: https://lumoryxr.github.io/lumo-task-web/

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Push landing/ to gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing
          force_orphan: false
          commit_message: "deploy: update landing page [skip ci]"
