name: Release (Windows)

# Manually triggered. Publishing the official Windows installer is GATED behind
# two checks that must pass first:
#
#   1. tests          — unit / contract / standards / security (Linux, fast)
#   2. smoke-windows  — launch the real Electron desktop app on windows-latest
#                       and walk the basic functionality (the full electron.spec
#                       walkthrough: boot + self-provisioned secrets + nav + task
#                       CRUD + settings + habits + …)
#
# Only if BOTH gates are green does the `release` job package the NSIS installer
# and create the GitHub Release. Set `dry_run: true` to run the entire pipeline
# (tests → smoke → package + verify installer, uploaded as an artifact) WITHOUT
# publishing — use it to validate a release candidate before shipping.
on:
  workflow_dispatch:
    inputs:
      version_label:
        description: 'Release version, e.g. 1.2.3 or v1.2.3 (required)'
        required: true
      dry_run:
        description: 'Run all gates + package, but DO NOT publish a GitHub Release'
        type: boolean
        default: false

# GITHUB_TOKEN needs write access to create releases and tags.
permissions:
  contents: write

jobs:
  # ── Gate 1 — correctness (Linux, cheap) ────────────────────────────────────
  tests:
    name: Tests (unit / contract / standards / security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Contract tests
        working-directory: packages/contracts
        run: npm test

      - name: Backend — typecheck + API (coverage) + security + standards
        working-directory: backend
        run: |
          npm ci --include=dev
          npm run typecheck
          npm run test:coverage
          npm run test:security
          npm run test:standards

      - name: Frontend — typecheck + lint + unit
        working-directory: web-app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

  # ── Gate 2 — Windows desktop smoke (launch + basic functionality) ──────────
  # Runs the robust desktop smoke suite (electron-smoke*.spec.ts) against the real
  # packaged dist on the actual target OS: launch + backend /health + render +
  # CRUD against the embedded SQLite + data-survives-restart. Secrets are scrubbed
  # inside the suite, so it also proves the desktop app self-provisions
  # LUMO_ENCRYPTION_KEY / LUMO_JWT_SECRET (the "packaged app won't start" bug).
  # The per-PR electron-smoke job runs this same suite on Linux; here it runs on
  # the actual Windows target before a release can publish.
  smoke-windows:
    name: Windows desktop smoke (launch + use)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build
        shell: bash

      - name: Install & build backend
        working-directory: backend
        run: |
          npm ci --include=dev
          npm run build
        shell: bash

      # Installs the Electron binary too (needed to launch the desktop app).
      - name: Install & build frontend
        working-directory: web-app
        run: |
          npm ci
          npm run build
        shell: bash

      - name: Install Playwright driver
        working-directory: web-app
        run: npx playwright install chromium

      - name: Run Electron desktop smoke suite
        working-directory: web-app
        run: npx playwright test --config playwright.electron-smoke.config.ts
        env:
          # Run against the production build, not the dev server.
          LUMO_USE_DIST: '1'
          # Electron's setuid sandbox can't initialise in CI; disable so launch
          # failures reflect real bugs, not sandbox/infra.
          ELECTRON_DISABLE_SANDBOX: '1'

      - name: Upload Electron report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-report-windows-${{ github.run_id }}
          path: web-app/playwright-report-electron-smoke/
          retention-days: 14

  # ── Release — package + publish (only after both gates pass) ───────────────
  release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    needs: [tests, smoke-windows]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Shared contract ────────────────────────────────────────────────────
      # @lumo/contracts (file: dependency) must be built before backend/frontend
      # resolve its types. (It is bundled into backend/dist by esbuild, so it is
      # not needed inside the packaged Electron app at runtime.)
      - name: Build shared contracts (@lumo/contracts)
        run: npm ci && npm run build
        working-directory: packages/contracts
        shell: bash

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Install backend deps
        run: npm ci --include=dev
        working-directory: backend

      - name: Build backend bundle
        run: npm run build
        working-directory: backend

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Install frontend deps
        run: npm ci
        working-directory: web-app

      - name: Build frontend
        run: npm run build
        working-directory: web-app

      # ── Stamp version into package.json ───────────────────────────────────
      - name: Set version in package.json
        shell: pwsh
        run: |
          # Strip a leading "v" or "V" (case-insensitive); TrimStart("v") would
          # miss an uppercase "V", leaving an invalid version like "V2.0.1" that
          # electron-builder rejects.
          $ver = "${{ github.event.inputs.version_label }}".Trim() -replace '^[vV]', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+([-+].*)?$') {
            Write-Error "Invalid version '$ver' (from input '${{ github.event.inputs.version_label }}'). Expected semver like 1.2.3 or v1.2.3."
            exit 1
          }
          $json = Get-Content "web-app/package.json" -Raw | ConvertFrom-Json
          $json.version = $ver
          $json | ConvertTo-Json -Depth 100 | Set-Content "web-app/package.json"
          Write-Host "Package version set to $ver"

      # ── Electron packaging ─────────────────────────────────────────────────
      - name: Package Windows installer (NSIS x64)
        run: npx electron-builder --win --x64 --publish never
        working-directory: web-app

      # ── Find the produced .exe + verify it is real ─────────────────────────
      - name: Locate and verify installer
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path "web-app/dist-electron" -Filter "*.exe" -Recurse |
                  Select-Object -First 1
          if (-not $file) {
            Write-Error "No .exe installer produced under web-app/dist-electron"
            exit 1
          }
          $mb = [math]::Round($file.Length / 1MB, 1)
          if ($file.Length -lt 20MB) {
            Write-Error "Installer is suspiciously small ($mb MB) - packaging likely incomplete"
            exit 1
          }
          Write-Host "Installer verified: $($file.Name) ($mb MB)"
          "path=$($file.FullName)"  | Out-File -Append $env:GITHUB_OUTPUT
          "name=$($file.Name)"      | Out-File -Append $env:GITHUB_OUTPUT

      # ── Always keep the built installer as an artifact (incl. dry runs) ────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumo-windows-installer-${{ github.run_id }}
          path: ${{ steps.installer.outputs.path }}
          retention-days: 7
          if-no-files-found: error

      # ── Generate release tag and name ─────────────────────────────────────
      - name: Generate release tag and name
        id: release-meta
        shell: pwsh
        run: |
          # Normalize to a bare version then re-prefix, so an uppercase "V"
          # input does not yield a doubled tag like "vV2.0.1" (StartsWith is
          # case-sensitive in PowerShell).
          $ver  = "${{ github.event.inputs.version_label }}".Trim() -replace '^[vV]', ''
          $tag  = "v${ver}"
          $name = "Lumo Task ${tag}"
          "tag=$tag"   | Out-File -Append $env:GITHUB_OUTPUT
          "name=$name" | Out-File -Append $env:GITHUB_OUTPUT

      # ── Web package (local/LAN browser build) ──────────────────────────────
      # Same repo, a different artifact from the desktop installer above: the
      # browser-accessed web server (the backend serves the SPA + /v1 API on one
      # port — LUMO_WEB_ROOT) as a no-install zip with a bundled node.exe. Built
      # here so a release ships BOTH the desktop installer and the web package.
      # The frontend is rebuilt with VITE_API_BASE=/v1 (same-origin) — the
      # electron build above used the default (desktop IPC) base, so this
      # overwrites web-app/dist, which is safe now that the installer is built.
      - name: Rebuild frontend for the web package (same-origin /v1)
        run: npm run build
        working-directory: web-app
        env:
          VITE_API_BASE: /v1

      - name: Assemble web package + bundle node.exe
        id: webpkg
        shell: pwsh
        run: |
          node scripts/package-web.mjs --skip-build --out dist-web/LumoTask-Web
          # Ship the exact Node this was built against so the target needs nothing.
          Copy-Item (Get-Command node).Source -Destination "dist-web/LumoTask-Web/node.exe"
          $zip = "LumoTask-Web-Windows-x64-${{ steps.release-meta.outputs.tag }}.zip"
          # Zip the directory (not dir/*) so node_modules/.node binaries recurse
          # reliably and it unzips into a clean LumoTask-Web/ folder.
          Compress-Archive -Path "dist-web/LumoTask-Web" -DestinationPath $zip -Force
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          if ((Get-Item $zip).Length -lt 20MB) {
            Write-Error "Web package is suspiciously small ($mb MB) - packaging likely incomplete"
            exit 1
          }
          Write-Host "Web package built: $zip ($mb MB)"
          "path=$((Get-Item $zip).FullName)" | Out-File -Append $env:GITHUB_OUTPUT
          "name=$zip"                        | Out-File -Append $env:GITHUB_OUTPUT

      - name: Upload web package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumo-web-windows-${{ github.run_id }}
          path: ${{ steps.webpkg.outputs.path }}
          retention-days: 7
          if-no-files-found: error

      # ── Create GitHub Release & upload BOTH artifacts (skipped on dry runs) ─
      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          name:     ${{ steps.release-meta.outputs.name }}
          draft:    false
          files: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.webpkg.outputs.path }}
          body: |
            ## Lumo Task for Windows (x64)

            两种安装方式，任选其一：

            ### 🖥️ 桌面版（推荐日常使用）
            下载 `${{ steps.installer.outputs.name }}` 双击安装即可。本地优先、可选云同步。

            > **提示**：首次运行 Windows 可能弹出 SmartScreen 安全提示，点击「更多信息」→「仍要运行」即可正常安装。

            ### 🌐 网页版（本机 / 局域网自托管）
            下载 `${{ steps.webpkg.outputs.name }}`，解压后双击 `start.bat` 即可——**免安装、免装 Node**。浏览器自动打开 `http://localhost:47291`；同一 Wi-Fi 的其他设备可用 `http://<本机IP>:47291` 访问同一份数据。数据存在本地 `data\lumo.db`。

            ---
            **构建信息**
            - Commit: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - 版本标签: `${{ github.event.inputs.version_label || '(未设置)' }}`
            - 门禁: 单元/契约/安全测试 + Windows 桌面冒烟（启动+基础功能）均已通过
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run — release publishing skipped
        if: ${{ github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: |
          echo "dry_run=true -> gates passed, both artifacts built & uploaded as CI artifacts, but NO GitHub Release was published."
          echo "Installer:   ${{ steps.installer.outputs.name }}"
          echo "Web package: ${{ steps.webpkg.outputs.name }}"
