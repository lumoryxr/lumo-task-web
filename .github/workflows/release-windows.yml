name: Release (Windows)

# Triggered manually. Supply a version like "1.2.3" or "v1.2.3".
# The version is written into package.json before packaging so the
# installer filename becomes LumoTask-Setup-{version}.exe.
on:
  workflow_dispatch:
    inputs:
      version_label:
        description: 'Release version, e.g. 1.2.3 or v1.2.3 (required)'
        required: true

# GITHUB_TOKEN needs write access to create releases and tags.
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Shared contract ────────────────────────────────────────────────────
      # @lumo/contracts (file: dependency) must be built before backend/frontend
      # resolve its types. (It is bundled into backend/dist by esbuild, so it is
      # not needed inside the packaged Electron app at runtime.)
      - name: Build shared contracts (@lumo/contracts)
        run: npm ci && npm run build
        working-directory: packages/contracts
        shell: bash

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Install backend deps
        run: npm ci --include=dev
        working-directory: backend

      - name: Build backend bundle
        run: npm run build
        working-directory: backend

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Install frontend deps
        run: npm ci
        working-directory: web-app

      - name: Build frontend
        run: npm run build
        working-directory: web-app

      # ── Stamp version into package.json ───────────────────────────────────
      - name: Set version in package.json
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version_label }}".TrimStart("v")
          $json = Get-Content "web-app/package.json" -Raw | ConvertFrom-Json
          $json.version = $ver
          $json | ConvertTo-Json -Depth 100 | Set-Content "web-app/package.json"
          Write-Host "Package version set to $ver"

      # ── Electron packaging ─────────────────────────────────────────────────
      - name: Package Windows installer (NSIS x64)
        run: npx electron-builder --win --x64 --publish never
        working-directory: web-app

      # ── Find the produced .exe ─────────────────────────────────────────────
      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path "web-app/dist-electron" -Filter "*.exe" -Recurse |
                  Select-Object -First 1
          "path=$($file.FullName)"  | Out-File -Append $env:GITHUB_OUTPUT
          "name=$($file.Name)"      | Out-File -Append $env:GITHUB_OUTPUT

      # ── Generate release tag and name ─────────────────────────────────────
      - name: Generate release tag and name
        id: release-meta
        shell: pwsh
        run: |
          $ver  = "${{ github.event.inputs.version_label }}".Trim()
          $tag  = if ($ver.StartsWith("v")) { $ver } else { "v${ver}" }
          $name = "Lumo Task ${tag}"
          "tag=$tag"   | Out-File -Append $env:GITHUB_OUTPUT
          "name=$name" | Out-File -Append $env:GITHUB_OUTPUT

      # ── Create GitHub Release & upload installer ───────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          name:     ${{ steps.release-meta.outputs.name }}
          draft:    false
          files:    ${{ steps.installer.outputs.path }}
          body: |
            ## Lumo Task for Windows (x64)

            下载 `${{ steps.installer.outputs.name }}` 双击安装即可。

            > **提示**：首次运行 Windows 可能弹出 SmartScreen 安全提示，点击「更多信息」→「仍要运行」即可正常安装。

            ---
            **构建信息**
            - Commit: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - 版本标签: `${{ github.event.inputs.version_label || '(未设置)' }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
