name: Deploy Website

# Builds the Astro marketing site in website/ and publishes it to the gh-pages
# branch, which GitHub Pages serves at the custom domain:
#   https://web.lumoryxr.com/
#
# The site is built at the domain ROOT (astro.config.mjs base '/'), and the
# custom domain is pinned by website/public/CNAME (copied into dist/ on build,
# so it survives every deploy). This is the single canonical marketing-site
# deploy (the old single-file landing/ and its deploy-landing.yml have been
# removed). It uses the peaceiris action (push to a branch) rather than the
# github-pages Actions environment, matching the existing setup and avoiding
# branch-protection rules.
#
# One-time Pages setup: Settings → Pages → Deploy from branch → gh-pages /
# (root), then set the custom domain to web.lumoryxr.com (a CNAME DNS record
# web → lumoryxr.github.io). "Enforce HTTPS" once the cert is issued.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build website/ and publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build (root base, custom domain web.lumoryxr.com)
        working-directory: website
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          force_orphan: false
          commit_message: "deploy: update website [skip ci]"
