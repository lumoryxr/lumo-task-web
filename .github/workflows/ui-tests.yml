name: UI Tests (Daily)

on:
  # Run on every PR targeting main and on pushes to main
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Keep the daily run for regression detection
  schedule:
    - cron: "0 8 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  ui-test:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      # @lumo/contracts (shared API contract, a file: dependency) must be built
      # before the web app can resolve its types / serve under Playwright.
      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Remove the pre-installed Microsoft apt sources that intermittently
      # return 403 Forbidden, which causes `--with-deps` (apt-get update) to
      # fail with exit code 100. The system libraries Playwright needs come
      # from the standard Ubuntu repos, which are unaffected.
      - name: Remove conflicting apt sources
        working-directory: .
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run UI tests
        run: npx playwright test
        env:
          BROWSER: none

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: web-app/playwright-report/
          retention-days: 14

      - name: Upload test videos on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-videos-${{ github.run_id }}
          path: web-app/test-results/
          retention-days: 7
