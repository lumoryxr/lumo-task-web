name: Prune Old Releases

on:
  release:
    types: [published]

jobs:
  prune:
    name: Keep latest 10 releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete releases beyond the 15 most recent
        uses: actions/github-script@v9
        with:
          script: |
            const KEEP = 10;

            // Fetch all releases sorted by published_at descending (GitHub default)
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const toDelete = releases.slice(KEEP);
            if (toDelete.length === 0) {
              console.log(`Only ${releases.length} release(s) — nothing to prune.`);
              return;
            }

            for (const release of toDelete) {
              console.log(`Deleting release: ${release.tag_name} (id=${release.id})`);

              // Delete the release first, then the tag
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
                console.log(`  Tag ${release.tag_name} deleted.`);
              } catch (e) {
                console.warn(`  Could not delete tag ${release.tag_name}: ${e.message}`);
              }
            }

            console.log(`Done. Pruned ${toDelete.length} old release(s).`);
