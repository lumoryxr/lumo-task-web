name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Frontend — Type Check ───────────────────────────────────────────────
  typecheck:
    name: Type Check (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      # @lumo/contracts is the shared API contract (a file: dependency). It must
      # be installed + built before any consumer resolves its types at this loc.
      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: tsc --noEmit
        run: npm run typecheck

  # ── 2. Frontend — Lint ────────────────────────────────────────────────────
  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: ESLint
        run: npm run lint

  # ── 3. Frontend — Build ───────────────────────────────────────────────────
  build:
    name: Build (frontend)
    runs-on: ubuntu-latest
    needs: [typecheck]
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Vite production build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: web-app/dist
          retention-days: 7

  # ── 4. Backend — Type Check ───────────────────────────────────────────────
  backend-typecheck:
    name: Type Check (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck

  # ── 5. Backend — Build ────────────────────────────────────────────────────
  backend-build:
    name: Build (backend)
    runs-on: ubuntu-latest
    needs: [backend-typecheck]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── 6. Backend — API Tests ───────────────────────────────────────────────
  backend-test:
    name: API Tests (backend)
    runs-on: ubuntu-latest
    needs: [backend-typecheck]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Run API tests (with coverage gate ≥80% lines)
        run: npm run test:coverage

  # ── 6b. Backend — Security suite (authn/authz/input/secrets/rate-limit) ─────
  backend-security:
    name: Security Tests (backend)
    runs-on: ubuntu-latest
    needs: [backend-typecheck]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build
      - name: Install dependencies
        run: npm ci
      - name: Run security tests
        run: npm run test:security

  # ── 6c. Backend — Standards guards (error-shape, contract-first) ────────────
  backend-standards:
    name: Standards Tests (backend)
    runs-on: ubuntu-latest
    needs: [backend-typecheck]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build
      - name: Install dependencies
        run: npm ci
      - name: Run standards tests
        run: npm run test:standards

  # ── 6d. Contracts — Schema unit tests (single source of truth) ──────────────
  contracts-test:
    name: Contract Tests (@lumo/contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run contract schema tests
        run: npm test

  # ── 7. Backend — Integration Tests (real HTTP + real SQLite) ────────────────
  backend-integration:
    name: Integration Tests (backend)
    runs-on: ubuntu-latest
    needs: [backend-typecheck]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  # ── 8. Frontend — Playwright UI Tests ───────────────────────────────────────
  ui-test:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck]
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Remove the pre-installed Microsoft apt sources that intermittently
      # return 403 Forbidden, which causes `--with-deps` (apt-get update) to
      # fail with exit code 100. The system libraries Playwright needs come
      # from the standard Ubuntu repos, which are unaffected.
      - name: Remove conflicting apt sources
        working-directory: .
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run UI tests
        run: npx playwright test
        env:
          BROWSER: none

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: web-app/playwright-report/
          retention-days: 7

      - name: Upload test videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-${{ github.sha }}
          path: web-app/test-results/
          retention-days: 3

  # ── 8b. Frontend — Unit + standards tests (Vitest) ──────────────────────────
  frontend-test:
    name: Unit Tests (frontend)
    runs-on: ubuntu-latest
    needs: [typecheck]
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Build shared contracts (@lumo/contracts)
        working-directory: packages/contracts
        run: npm ci && npm run build
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Run Vitest (unit + standards)
        run: npm test

  # ── 9. Security — npm audit ───────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # devDeps (electron, electron-builder, vite, esbuild) are build-only tools
      # and are never shipped to production — omit them from the audit.
      - name: Audit frontend deps (production only)
        run: cd web-app && npm ci && npm audit --audit-level=high --omit=dev
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Audit backend deps
        run: cd backend && npm ci && npm audit --audit-level=high

  # ── 10. Render deploy check (build + boot exactly as Render does) ───────────
  #    Reproduces the production deploy on every push so a broken build or a
  #    non-booting bundle is caught in CI, not on Render. Runs the SAME backend
  #    buildCommand as render.yaml, then boot-smoke-tests the emitted bundle:
  #    start it, poll /health, and register a user — the real deploy contract.
  render-deploy-check:
    name: Render Deploy Check (backend build + boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match render.yaml's NODE_VERSION ("22") and backend engines (>=22.5.0).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Mirror render.yaml `buildCommand` for the backend service verbatim:
      #   npm --prefix ../packages/contracts ci --include=dev
      #   && npm --prefix ../packages/contracts run build
      #   && npm ci --include=dev && npm run build
      # (run from `backend/`, which is the service's rootDir on Render).
      - name: Build backend the Render way (contracts → backend bundle)
        working-directory: backend
        run: |
          npm --prefix ../packages/contracts ci --include=dev
          npm --prefix ../packages/contracts run build
          npm ci --include=dev
          npm run build
          test -f dist/bundle.cjs || { echo "::error::dist/bundle.cjs was not produced"; exit 1; }

      # Boot the exact artifact Render runs (`node dist/bundle.cjs`) with
      # production env + generated secrets, then prove the deploy contract:
      # the health check Render polls (/health) answers, and the API works.
      - name: Boot-smoke the production bundle (/health + register)
        working-directory: backend
        env:
          NODE_ENV: production
          PORT: "47399"
          LUMO_DB_PATH: /tmp/render-smoke.db
        run: |
          export LUMO_JWT_SECRET="$(openssl rand -hex 48)"
          export LUMO_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          rm -f /tmp/render-smoke.db
          node dist/bundle.cjs > /tmp/boot.log 2>&1 &
          BOOT_PID=$!
          # Poll the health check Render uses (healthCheckPath: /health).
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:47399/health > /dev/null 2>&1; then ok=1; break; fi
            # Fail fast if the process died during startup.
            kill -0 "$BOOT_PID" 2>/dev/null || { echo "::error::bundle exited before serving"; cat /tmp/boot.log; exit 1; }
            sleep 0.5
          done
          if [ -z "$ok" ]; then echo "::error::/health never became ready"; cat /tmp/boot.log; kill "$BOOT_PID" 2>/dev/null; exit 1; fi
          echo "health: $(curl -fsS --max-time 5 http://127.0.0.1:47399/health)"
          # Exercise a real endpoint end to end (migrations ran, routing works).
          code=$(curl -s --max-time 10 -o /tmp/reg.json -w '%{http_code}' -X POST \
            http://127.0.0.1:47399/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_smoke","password":"pass1234"}')
          kill "$BOOT_PID" 2>/dev/null || true
          if [ "$code" != "201" ]; then
            echo "::error::register smoke expected 201, got $code"; cat /tmp/reg.json; cat /tmp/boot.log; exit 1
          fi
          echo "register smoke: HTTP $code ✓"

  # ── 11. Aggregate gate ─────────────────────────────────────────────────────
  #    Branch protection watches only this job.
  ci:
    name: CI
    if: always()
    needs: [typecheck, lint, build, backend-typecheck, backend-build, backend-test, backend-security, backend-standards, contracts-test, backend-integration, frontend-test, ui-test, security, render-deploy-check]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"failure"|"cancelled"'; then
            echo "One or more CI checks failed."
            exit 1
          fi
          echo "All CI checks passed."
